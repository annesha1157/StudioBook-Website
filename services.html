<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudioBook - Services</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg studio-navbar">

        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="index.html">

                <div class="logo-box">
                    <i class="bi bi-mic-fill text-white"></i>
                </div>

                <span class="brand-name">StudioBook</span>

            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#studioNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="studioNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="studios.html">Studios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="services.html">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reviews.html">Reviews</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="packages.html">Packages</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- SERVICES -->
    <main class="content-wrap">

        <h1 class="page-title">Studio Services & Equipment</h1>

        <div class="row g-4">

            <!-- IMAGE -->
            <div class="col-lg-7">

                <img src="video.jpg"
                     alt="Studio"
                     class="service-studio-image"
                     id="serviceImage">

            </div>


            <!-- INFORMATION -->
            <div class="col-lg-5">

                <!-- Studio Name & Price -->
                <div class="info-card mb-3">

                    <h2 class="studio-name" id="studioName">
                        Video Studio
                    </h2>

                    <p class="studio-price" id="studioPrice">
                        ৳800 / hour
                    </p>

                </div>


                <!-- Facilities -->
                <div class="info-card mb-3">

                    <ul class="feature-list" id="featureList">

                        <li>
                            <i class="bi bi-check-circle-fill"></i>
                            Camera setup
                        </li>

                        <li>
                            <i class="bi bi-check-circle-fill"></i>
                            Studio lighting
                        </li>

                        <li>
                            <i class="bi bi-check-circle-fill"></i>
                            Green screen
                        </li>

                        <li>
                            <i class="bi bi-check-circle-fill"></i>
                            Microphone
                        </li>

                    </ul>

                </div>


                <!-- Booking -->
                <div class="info-card">

                    <a href="booking.html"
                       class="btn btn-book"
                       id="bookButton">

                        Book This Studio →

                    </a>

                </div>

            </div>

        </div>

    </main>
    <footer class="footer">

        <div class="social-icons">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-youtube"></i></a>
        </div>

        <div class="footer-bottom">
            © 2026 StudioBook. All rights reserved.
        </div>

    </footer>


    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
