<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - StudioBook</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg studio-navbar">

        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">

                <div class="logo-box">
                    <i class="bi bi-mic-fill text-white"></i>
                </div>

                <span class="brand-name">StudioBook</span>

            </a>

<!-- Hamburger Button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#studioNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="studioNavbar">
            
            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="index.html">Home</a>

                <a class="nav-link" href="studios.html">Studios</a>

                <a class="nav-link" href="services.html">Services</a>

                <a class="nav-link" href="reviews.html">Reviews</a>

                <a class="nav-link" href="packages.html">Packages</a>

                <a class="nav-link" href="booking.html">Booking</a>

                <a class="nav-link active" href="owner.html">Dashboard</a>

            </div>

        </div>

    </nav>


    <!-- ================= OWNER DASHBOARD ================= -->

    <div class="owner-container">

        <div class="owner-header">

            <h1>Booking Dashboard</h1>

            <button id="clearBookings" class="clear-bookings-btn">
                <i class="bi bi-trash"></i>
                Clear All Bookings
            </button>

        </div>

        <p class="owner-subtitle">
            View all studio and package bookings
        </p>


        <!-- ================= BOOKING TABLE ================= -->

        <div class="booking-table-box">

            <table class="table booking-table">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Studio / Package</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="bookingTableBody">
                </tbody>

            </table>

        </div>


        <!-- No Booking Message -->

        <p id="noBookings" class="no-bookings">
            No bookings yet.
        </p>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="social-icons">

            <a href="#">
                <i class="bi bi-facebook"></i>
            </a>

            <a href="#">
                <i class="bi bi-instagram"></i>
            </a>

            <a href="#">
                <i class="bi bi-youtube"></i>
            </a>

        </div>

        <p>
            © 2026 StudioBook. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
