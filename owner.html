<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard - StudioBook</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="owner-container">

        <div class="owner-header">
    <h1>Booking Dashboard</h1>

    <button id="clearBookings" class="clear-bookings-btn">
        <i class="bi bi-trash"></i> Clear All Bookings
    </button>
</div>
        <p class="owner-subtitle">
            View all studio and package bookings
        </p>

        <div class="booking-table-box">

            <table class="table booking-table">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Studio / Package</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="bookingTableBody">
                </tbody>

            </table>

        </div>

        <p id="noBookings" class="no-bookings">
            No bookings yet.
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
